services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_CHAT_MODEL: "llama3.2"
      OLLAMA_EMBED_MODEL: "nomic-embed-text"
      CHROMA_PERSIST_DIR: "./vector_store/chroma_db"
      DATA_DIR: "./data"
    volumes:
      - ./vector_store:/app/vector_store
      - ./data:/app/data
